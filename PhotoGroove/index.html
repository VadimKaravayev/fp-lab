<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photo Groove</title>

  <link rel="stylesheet" href="http://elm-in-action.com/styles.css">
  <link rel="stylesheet" href="http://elm-in-action.com/range-slider.css">
  <script src="http://elm-in-action.com/range-slider.js"></script>
  <script src="http://elm-in-action.com/pasta.js"></script>
  <script>
    class RangeSlide extends HTMLElement {
      connectedCallback() {
        const input = document.createElement("input");
        this.appendChild(input);

        const jsr = new JSR(input, {
          max: this.max,
          values: [this.val],
          sliders: 1,
          grid: false
        });

        const rangeSliderNode = this;

        jsr.addEventListener("update", (elem, value) => {
            rangeSliderNode.dispatchEvent(new CustomEvent("slide", {
              detail: {
                userSlidTo: value
              }
            }));
        });
      }
    }
    window.customElements.define("range-slider", RangeSlide);
  </script>

</head>

<body>
  <div id="app"></div>

  <script src="app.js"></script>
  <script>
    const app = Elm.PhotoGroove.init({ node: document.getElementById("app") });
    app.ports.setFilters.subscribe((options) => {
      requestAnimationFrame(() => {
        const mainCanvas = document.getElementById("main-canvas");
        Pasta.apply(mainCanvas, options);
      })
    });
    Pasta.addActivityListener((activity) => {
      console.log("Got some activity to send to Elm, ", activity);
      app.ports.activityChanges.send(activity);
    });
  </script>
</body>

</html>
